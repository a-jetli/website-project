<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AJ | Resume</title>
  <meta name="description" content="Resume of Ansh Jetli — CS student at Rutgers University.">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/sections.css">
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='12' fill='%230d0f14'/><text y='72' x='50' text-anchor='middle' font-size='52' font-family='Georgia,serif' font-weight='600' fill='%236ba7f5'>AJ</text></svg>">
  <meta property="og:title" content="Ansh Jetli | Resume">
  <meta property="og:description" content="Ansh's Resume">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ajetli.com/resume.html">
  <!-- Re-enable once a card is committed; og-card.png is currently gitignored.
  <meta property="og:image" content="https://ajetli.com/og-card.png">
  <meta property="og:image:alt" content="Ansh Jetli, CS student at Rutgers New Brunswick, focused on applied AI and backend engineering in Python.">
  -->
</head>

<body>
  <div class="layout">
    <aside class="left-panel">
      <img src="header_photo.jpg" class="photo" alt="Ansh Jetli">
      <div class="identity">
        <h1 class="name">Ansh Jetli</h1>
        <p class="occupation">CS Student @ Rutgers New Brunswick</p>
      </div>
      <div class="nav-footer">
        <nav>
          <a href="index.html">Home</a>
          <a href="projects.html">Projects</a>
          <a href="resume.html">Resume</a>
        </nav>
        <div class="social-links">
          <a href="https://github.com/a-jetli" target="_blank" aria-label="GitHub" title="GitHub">
            <i class="fab fa-github"></i>
          </a>
          <a href="https://www.linkedin.com/in/anshjetli/" target="_blank" aria-label="LinkedIn" title="LinkedIn">
            <i class="fab fa-linkedin"></i>
          </a>
          <button type="button" class="email-trigger" data-email-trigger aria-haspopup="dialog"
            aria-controls="email-dialog" aria-label="Show email address" title="Email">
            <i class="fas fa-envelope"></i>
          </button>
        </div>
        <div class="theme-switcher">
          <button class="theme-icon" id="theme-toggle">&#9680;</button>
          <div class="theme-menu" id="theme-menu">
            <button data-theme="light">Light</button>
            <button data-theme="dark">Dark</button>
            <div class="theme-submenu-wrapper">
              <button class="has-submenu">Other &#9656;</button>
              <div class="theme-submenu" id="theme-submenu">
                <button data-theme="autumn">Autumn</button>
                <button data-theme="wisteria">Wisteria</button>
                <button data-theme="stormy">Storm</button>
                <button id="custom-trigger">— Custom —</button>
              </div>
            </div>
            <button id="glow-toggle">Glow: On</button>
          </div>
        </div>
      </div>
    </aside>

    <main class="right-panel">
      <section id="resume">
        <h2 class="bio-heading"><span style="color: var(--accent)">Resume</span></h2>
        <a class="resume-download" href="ansh_resume_web.pdf" download>Download PDF <i
            class="fas fa-arrow-down"></i></a>
        <iframe src="ansh_resume_web.pdf" width="100%" height="900px" style="border: none;"></iframe>
      </section>
    </main>
  </div>

  <dialog class="modal modal--compact custom-prompt" id="custom-prompt" aria-labelledby="custom-prompt-title">
    <div class="modal__content">
      <h2 class="modal__title" id="custom-prompt-title">Custom theme</h2>
      <label>Page background<input type="color" data-var="--bg" value="#0d0f14"></label>
      <label>Panels &amp; cards<input type="color" data-var="--bg-subtle" value="#1e2435"></label>
      <label>Body text<input type="color" data-var="--text" value="#bcc2cd"></label>
      <label>Headings &amp; labels<input type="color" data-var="--text-muted" value="#8b93a1"></label>
      <label>Links &amp; accents<input type="color" data-var="--accent" value="#6ba7f5"></label>
      <label>Lines &amp; borders<input type="color" data-var="--border" value="#252a38"></label>
      <div class="modal__actions">
        <button type="button" class="modal__button modal__button--primary" id="custom-apply">Apply</button>
        <button type="button" class="modal__button" id="custom-close">Close</button>
      </div>
    </div>
  </dialog>

  <footer>
    <p>Designed & built by Ansh Jetli · 2026 </p>
  </footer>

  <script src="js/theme.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/email.js"></script>
</body>

</html>
